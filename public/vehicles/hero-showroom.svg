<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="55%" stop-color="#14181F"/>
      <stop offset="100%" stop-color="#1C222B"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181C22"/>
      <stop offset="100%" stop-color="#090A0D"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C89D54" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C89D54" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C89D54" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3440"/>
      <stop offset="45%" stop-color="#171B22"/>
      <stop offset="100%" stop-color="#0D1015"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A5C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#12161C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Architectural Showroom Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="500" y1="0" x2="500" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
    <line x1="1100" y1="0" x2="1100" y2="620"/>
    <line x1="1400" y1="0" x2="1400" y2="620"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="380" x2="1600" y2="380"/>
  </g>
  <!-- Warm Studio Light Strip -->
  <rect x="250" y="90" width="1100" height="6" rx="3" fill="url(#goldGlow)"/>
  <ellipse cx="850" cy="635" rx="580" ry="65" fill="#000000" opacity="0.75"/>
  <rect x="0" y="620" width="1600" height="280" fill="url(#floor)"/>
  <line x1="0" y1="620" x2="1600" y2="620" stroke="#C89D54" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Flagship Full-Size Luxury SUV Silhouette & Bodywork -->
  <g transform="translate(260, 230)">
    <!-- Lower Shadow -->
    <ellipse cx="560" cy="395" rx="490" ry="26" fill="#050608"/>
    <!-- Main Chassis Body -->
    <path d="M90 270 L135 205 L280 190 L410 92 L875 92 L985 185 L1035 210 L1050 325 L995 355 L110 355 L75 325 Z" fill="url(#carBody)" stroke="#485366" stroke-width="2"/>
    <!-- Upper Cabin Greenhouse -->
    <path d="M310 190 L422 106 L855 106 L955 185 Z" fill="url(#glass)" stroke="#64748B" stroke-width="1.5"/>
    <!-- B and C Pillars -->
    <line x1="565" y1="106" x2="550" y2="190" stroke="#14181F" stroke-width="14"/>
    <line x1="755" y1="106" x2="765" y2="188" stroke="#14181F" stroke-width="16"/>
    <!-- Character Shoulder Line -->
    <line x1="130" y1="225" x2="1010" y2="215" stroke="#C89D54" stroke-opacity="0.55" stroke-width="2"/>
    <!-- Front Matrix LED Headlight -->
    <polygon points="92,235 155,222 165,245 96,254" fill="#F8FAFC"/>
    <polygon points="95,238 152,226 158,242 98,249" fill="#38BDF8" opacity="0.4"/>
    <!-- Front Grille Chrome Bars -->
    <rect x="78" y="255" width="32" height="58" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="82" y1="268" x2="106" y2="268" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="82" y1="282" x2="106" y2="282" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="82" y1="296" x2="106" y2="296" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Rear LED Tail Lamp -->
    <polygon points="1012,212 1044,218 1046,258 1015,252" fill="#EF4444"/>
    <!-- Lower Rocker Trim -->
    <rect x="330" y="330" width="440" height="10" rx="3" fill="#334155"/>
    <!-- Wheel Arches & 22-inch Multi-Spoke Alloy Wheels -->
    <circle cx="245" cy="350" r="82" fill="#0B0D10"/>
    <circle cx="245" cy="350" r="68" fill="#1E232B" stroke="#334155" stroke-width="8"/>
    <circle cx="245" cy="350" r="46" fill="#0F172A" stroke="#C89D54" stroke-width="2.5"/>
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="245" y1="304" x2="245" y2="396"/>
      <line x1="199" y1="350" x2="291" y2="350"/>
      <line x1="212" y1="317" x2="278" y2="383"/>
      <line x1="278" y1="317" x2="212" y2="383"/>
    </g>
    <circle cx="245" cy="350" r="12" fill="#C89D54"/>

    <circle cx="855" cy="350" r="82" fill="#0B0D10"/>
    <circle cx="855" cy="350" r="68" fill="#1E232B" stroke="#334155" stroke-width="8"/>
    <circle cx="855" cy="350" r="46" fill="#0F172A" stroke="#C89D54" stroke-width="2.5"/>
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="855" y1="304" x2="855" y2="396"/>
      <line x1="809" y1="350" x2="901" y2="350"/>
      <line x1="822" y1="317" x2="888" y2="383"/>
      <line x1="888" y1="317" x2="822" y2="383"/>
    </g>
    <circle cx="855" cy="350" r="12" fill="#C89D54"/>
  </g>
</svg>
